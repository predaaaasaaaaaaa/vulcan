# VULCAN configuration — single source for all tunables.
# Values marked CALIBRATE are set during build phases and recorded in BUILDLOG.md.

style:
  accent_color: "#FFCC00"      # single accent; all other style tokens live in remotion/src/tokens.ts
  font_family: "Outfit"        # committed .ttf in remotion/public/fonts — no runtime fetch

audio:
  target_lufs: -14.0
  sfx_lufs: -22.0
  music_bed: true              # synthesized mood beds (sfx/music/), word-driven ducking in the renderer
  music_bed_lufs: -26.0

asr:
  engine: faster-whisper       # decided Phase 2 (benchmark vs whisperx) — see BUILDLOG
  model: small                 # decided Phase 2
  compute_type: int8           # CPU inference
  language: null               # null = auto-detect (English or French expected)

director:
  base_url: "https://api.minimax.io/anthropic"
  api_key_env: "MINIMAX_API_KEY"
  env_file: "~/.hermes/.env"   # key is READ from this file at runtime, never stored
                               # (~ expands; override with VULCAN_ENV_FILE=/path/to/.env)
  model: "MiniMax-M3"
  temperature: 0.2
  max_tokens: 8000
  max_retries_per_pass: 3
  richness_floor: 0.35         # min fraction of beats with a visual element (post-mortem 2026-07-14)
  timeout_s: 240

beats:
  min_ms: 1200
  max_ms: 5000
  pause_split_ms: 350

assets:
  min_edge_px: 500
  siglip_model: "google/siglip-base-patch16-224"
  # 0.05: calibrated range is good ≥0.078 / bad ≤0.013 (BUILDLOG Phase 3) — the 0.30
  # floor tried post-run would also reject EVERY correct match (best good pair ever
  # measured: 0.168) and silently disable the asset engine. The "bull on abstract
  # topic" failure was a QUERY-choice error, not a scoring error (0.114 was a
  # correct match for the bull query): fixed at the source by pass_b rule 12 + the
  # deterministic spoken-word overlap guard in director/passes.py.
  siglip_threshold: 0.05
  max_per_beat: 3
  cache_db: "cache/media.db"

render:
  fps: 30
  width: 1080
  height: 1920
  crf: 23                      # tuned Phase 4 so 3min <= 45MB
  concurrency: 4               # calibrated Phase 4: 62s render in 77s, RAM stable (BUILDLOG)
  timeout_min: 30

qc:
  duration_delta_ms: 150
  max_size_mb: 45
  lufs_tolerance: 1.0
  frame_sample_every_s: 5
  min_luma_variance: 4.0       # calibrated Phase 4: dead 1.8-2.9, live >=4.5 (BUILDLOG)
  min_visual_coverage: 0.20    # post-asset-failures floor: below this the video is text-only → fail loudly

delivery:
  mode: hermes_send            # hermes_send | direct_bot (fallback)
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  chat_id_env: "TELEGRAM_HOME_CHANNEL"

trigger:
  auto_mode: false             # Hermes asks "Forge this? y/n" before running
  voice_latest_window_min: 15  # `vulcan run --latest` accepts oggs younger than this
  voice_cache_dirs:            # where your platform caches incoming voice notes
                               # (~ expands; override with VULCAN_VOICE_DIRS=dir1:dir2)
    - "~/.hermes/cache/audio"
    - "~/.hermes/audio_cache"

paths:
  runs_dir: "runs"
  sfx_index: "sfx/index.json"
