<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VULCAN — voice note to viral vertical video">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111114"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="forgeGlow" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#FFCC00" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFCC00" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bar { fill: #FFCC00; transform-box: fill-box; transform-origin: center; animation: eq 1.5s ease-in-out infinite; }
      .b2  { animation-delay: .1s; }  .b3  { animation-delay: .2s; }
      .b4  { animation-delay: .3s; }  .b5  { animation-delay: .4s; }
      .b6  { animation-delay: .5s; }  .b7  { animation-delay: .6s; }
      .b8  { animation-delay: .7s; }  .b9  { animation-delay: .8s; }
      .b10 { animation-delay: .9s; }  .b11 { animation-delay: 1.0s; }
      @keyframes eq {
        0%, 100% { transform: scaleY(0.3); }
        50%      { transform: scaleY(1); }
      }
      .play { animation: beat 1.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes beat {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.12); }
      }
      @media (prefers-reduced-motion: reduce) { .bar, .play { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#forgeGlow)"/>

  <!-- the voice: live waveform -->
  <g>
    <rect class="bar"     x="84"  y="115" width="13" height="70"/>
    <rect class="bar b2"  x="112" y="90"  width="13" height="120"/>
    <rect class="bar b3"  x="140" y="65"  width="13" height="170"/>
    <rect class="bar b4"  x="168" y="98"  width="13" height="104"/>
    <rect class="bar b5"  x="196" y="55"  width="13" height="190"/>
    <rect class="bar b6"  x="224" y="85"  width="13" height="130"/>
    <rect class="bar b7"  x="252" y="110" width="13" height="80"/>
    <rect class="bar b8"  x="280" y="72"  width="13" height="156"/>
    <rect class="bar b9"  x="308" y="100" width="13" height="100"/>
    <rect class="bar b10" x="336" y="120" width="13" height="60"/>
    <rect class="bar b11" x="364" y="132" width="13" height="36"/>
  </g>

  <!-- wordmark -->
  <text x="706" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="94" font-weight="900" fill="#FFCC00" letter-spacing="5">VULCAN</text>
  <text x="706" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="19" fill="#ffffff" opacity="0.62">voice note → viral vertical video · the LLM never touches the timeline</text>

  <!-- the video: 9:16 frame, frame-synced heart beating -->
  <rect x="1030" y="62" width="99" height="176" rx="15" fill="none" stroke="#FFCC00" stroke-width="4.5"/>
  <rect x="1030" y="62" width="99" height="176" rx="15" fill="#FFCC00" opacity="0.05"/>
  <path class="play" d="M 1064 128 l 38 22 -38 22 z" fill="#FFCC00"/>
</svg>
